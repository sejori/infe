[workspace]
resolver = "2"
members = [
    "crates/infe-core",
    "crates/infe-parsers",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sejori/infe"
homepage = "https://github.com/sejori/infe"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.bench]
debug = true
