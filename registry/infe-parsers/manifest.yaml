manifest_version: "0.1.0"
component: infe-parsers
version: "0.1.1"
type: tool_call_and_reasoning_parser
status: alpha

description: |
  Streaming tool-call and reasoning-content parsers for LLM inference engines.
  Replaces the per-token Python parsers in vLLM and SGLang with step-granular
  Rust calls via PyO3.

engine_seams:
  vllm:
    tool_parser:
      flag: "--tool-call-parser infe_hermes --tool-parser-plugin <path-to-shims/vllm/infe_parsers_vllm/__init__.py>"
      registered_via: ToolParserManager.register_module
      plugin_path_note: "vLLM 0.28.0's import_tool_parser() accepts a FILE PATH only, not a module name. vLLM main also accepts a module name."
    reasoning_parser:
      flag: "--reasoning-parser infe_deepseek_reasoning --reasoning-parser-plugin <path>"
      registered_via: ReasoningParserManager
    versions:
      tested: "0.28.0"
      min: "0.28.0"
  sglang:
    tool_call_parser:
      flag: "--tool-call-parser infe_hermes"
      registered_via: FunctionCallParser.ToolCallParserEnum
      launcher: "python -m infe_parsers_sglang.launch -- <sglang args>"
    versions:
      tested: "0.5.18"
      min: "0.5.18"

dialects:
  tool:
    - name: hermes
      models: ["NousResearch/Hermes", "Qwen2.5-Instruct", "many fine-tunes"]
      markers: ["\u003ctool_call\u003e", "\u003c/tool_call\u003e"]
      features:
        markerless_continuation: true
        description: "After >=1 completed call, bare '{' is treated as a new tool call (B6 fix for SGLang template)"
    - name: llama3_json
      models: ["Llama-3.1+", "Meta-Llama-3.1-Instruct"]
      markers: ["{", "}"]
  reasoning:
    - name: deepseek_reasoning
      models: ["DeepSeek-R1", "Qwen-QwQ"]
      markers: ["\u003cthink\u003e", "\u003c/think\u003e"]

parity:
  arguments_extraction: true
  tool_call_id: true
  index_auto_increment: true
  streaming_diff: true
  random_ids: true
  markerless_continuation: true
  nameless_fragment_forwarding: true

conformance:
  fixtures: "conformance/fixtures/parsers/"
  runner: "cargo test --test conformance"
  fixture_count: 14
  sources: ["synthetic", "sglang-qwen25-template"]
  coverage:
    - single_tool_call
    - multiple_tool_calls
    - streamed_tool_call
    - content_tool_content
    - split_marker
    - nested_json_arguments
    - markerless_continuation
    - markerless_continuation_streamed
    - multi_call_streamed
    - streamed_nested_args
    - llama3_json_single
    - llama3_json_multi_call
    - llama3_json_nested_args
    - deepseek_reasoning_block

benchmarks:
  latest_result: "bench/results/rtx4090-20260905-round3/"
  latest_date: "2026-09-05"
  note: "Round 3 A/B on RTX 4090. vLLM full parity (calls/args/ids match stock). SGLang B6+B8 fixes now on main but not yet benchmarked. Next round will test all merged fixes together."
