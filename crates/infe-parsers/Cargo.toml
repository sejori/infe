[package]
name = "infe-parsers"
description = "Streaming tool-call and reasoning-content parsers for LLM inference engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
infe-core = { path = "../infe-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse_stream"
harness = false

[lints]
workspace = true
